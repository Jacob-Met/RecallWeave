name: probability-pr168-learner-qualification

# The contract pins one received consumer composition; it is not a permanent learner gate.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-learner:
    if: github.event.pull_request.number == 168
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check receiver syntax
        run: node --check tools/check_probability_current_learner_browser.mjs
      - name: Receive the current learner with installed Chrome and its default sandbox
        run: |
          chrome_bin="$(command -v google-chrome)"
          "$chrome_bin" --version
          node tools/check_probability_current_learner_browser.mjs \
            --root "$GITHUB_WORKSPACE" \
            --browser "$chrome_bin" \
            --output "$RUNNER_TEMP/probability-current-learner" \
            --contract "$GITHUB_WORKSPACE/docs/qualification/probability-current-learner-cd1df0f1ee24/contract-v1.json" \
            --emit-bundle
