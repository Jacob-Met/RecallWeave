name: congruences-browser

on:
  pull_request:
    paths:
      - src/congruences.mjs
      - src/congruences-ui.mjs
      - templates/congruences-explorer.html
      - courses/congruences-explorer.html
      - courses/congruences.json
      - courses/congruences.md
      - tools/build-congruences.mjs
      - tools/check-congruences-browser.mjs
      - tests/congruences.test.mjs
      - tests/congruences-course.test.mjs
      - src/deck.mjs
      - demo.html
      - .github/workflows/congruences-browser.yml
  push:
    branches: [main]
    paths:
      - src/congruences.mjs
      - src/congruences-ui.mjs
      - templates/congruences-explorer.html
      - courses/congruences-explorer.html
      - courses/congruences.json
      - courses/congruences.md
      - tools/build-congruences.mjs
      - tools/check-congruences-browser.mjs
      - tests/congruences.test.mjs
      - tests/congruences-course.test.mjs
      - src/deck.mjs
      - demo.html
      - .github/workflows/congruences-browser.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Keep the existing workflows intact and use their pinned action identities.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check maintained receiver syntax
        run: node --check tools/check-congruences-browser.mjs
      - name: Verify the committed standalone congruence lab
        run: |
          node tools/build-congruences.mjs --check
      - name: Receive exact congruences and course imports with installed Chrome
        run: |
          chrome_bin="$(command -v google-chrome)"
          "$chrome_bin" --version
          node tools/check-congruences-browser.mjs --root "$GITHUB_WORKSPACE" --browser "$chrome_bin" --output "$RUNNER_TEMP/congruences-receiving" --emit-bundle
